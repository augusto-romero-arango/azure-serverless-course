name: Deploy Order Tracker Function

on:
    push:
        branches:
            - main
        paths:
        - 'order-tracker-function/**'
        - '.github/workflows/deploy-order-tracker.yml'
    workflow_dispatch:

jobs:
    deploy-order-tracker:
        name: Deploy Order Tracker Function
        runs-on: ubuntu-latest
        steps:
        
            - name: check out repo
              uses: actions/checkout@v3
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'

            - name: Install dependencies
              working-directory: order-tracker-function
              run: npm install

            - name: Deploy to Azure
              uses: azure/functions-action@v1
              with:
                app-name: 'order-system-order-tracker-func-development'
                package: 'order-tracker-function'
                publish-profile: ${{ secrets.ORDER_TRACKER_AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}


